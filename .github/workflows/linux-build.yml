name: Linux source-only build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SKN_APP_MODE: cloud
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TMPDIR: ${{ github.workspace }}/.ci_tmp
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Create isolated scratch directory
        run: mkdir -p .ci_tmp
      - name: Verify source allowlist and hashes before installation
        run: python -B -m ci.audit_source
      - name: Install declared Linux system packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(grep -Ev '^\s*(#|$)' packages.txt)
          for package in "${packages[@]}"; do
            [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || exit 1
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"
      - name: Install unchanged Cloud requirements
        run: python -m pip install --no-cache-dir -r deployment/requirements.txt
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Check SDK imports CPU provider libvips and H264 without models
        run: python -B -m ci.check_runtime
      - name: Synthetic tests without credentials or model weights
        run: python -B -m ci.run_synthetic
      - name: Streamlit initial UI and localhost startup without model loading
        run: python -B -m ci.startup_smoke
      - name: Final source and scratch audit
        if: always()
        run: python -B -m ci.audit_source --check-scratch
# No artifact uploads, dependency cache uploads, model access, or deployment steps.
